<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AtharvaOS — Productivity Copilot</title>
  
  <!-- Telegram Web App JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Google Fonts: Figtree + Fraunces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  
  <!-- Lucide Professional Outline Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Decorative Flo Organic Background Waves -->
  <div class="bg-waves" aria-hidden="true">
    <svg viewBox="0 0 500 800" preserveAspectRatio="none">
      <path d="M120,-50 C20,200 280,350 150,550 C50,700 200,850 120,950" fill="none" stroke="rgba(186, 171, 255, 0.45)" stroke-width="2.5" />
      <path d="M280,-50 C380,180 180,400 320,600 C420,750 250,900 350,1000" fill="none" stroke="rgba(186, 171, 255, 0.3)" stroke-width="2" />
      <path d="M420,-50 C320,220 480,450 380,680 C300,820 450,950 400,1050" fill="none" stroke="rgba(200, 240, 220, 0.4)" stroke-width="2" />
    </svg>
  </div>

  <div class="app-shell">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-logo">
          <span class="logo-text">Atharva<span>OS</span></span>
        </div>
        <div class="live-pill">
          <span class="pulse-dot"></span> Live
        </div>
      </div>
      
      <div class="user-greeting-row">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-info">
          <span class="eyebrow">PRODUCTIVITY COPILOT</span>
          <h1 class="greeting-heading" id="greetingText">Good day, Atharva</h1>
        </div>
      </div>
    </header>

    <!-- Hero Momentum Card -->
    <section class="card hero-card">
      <div class="hero-content">
        <div class="progress-box">
          <svg class="progress-ring" width="80" height="80">
            <circle class="progress-ring__bg" stroke-width="7" fill="transparent" r="32" cx="40" cy="40"/>
            <circle class="progress-ring__circle" id="progressCircle" stroke-width="7" stroke-dasharray="201.06" stroke-dashoffset="201.06" stroke-linecap="round" fill="transparent" r="32" cx="40" cy="40"/>
          </svg>
          <div class="progress-label" id="progressPercent">0%</div>
        </div>

        <div class="hero-text">
          <div class="momentum-tag">
            <i data-lucide="zap" class="icon-sm"></i> DAILY MOMENTUM
          </div>
          <h2 class="hero-title" id="taskSummaryHeadline">0 of 0 Completed</h2>
          <p class="hero-quote" id="vibeQuote">Small daily wins compound into unstoppable momentum.</p>
        </div>
      </div>
    </section>

    <!-- Dual Color Navigation Pills (Signature Flo Lavender) -->
    <nav class="nav-pills-bar" aria-label="Categories">
      <button class="pill-btn active" data-filter="all">
        <span class="icon-chip"><i data-lucide="layout-grid"></i></span>
        <span>All</span>
      </button>
      <button class="pill-btn" data-filter="task">
        <span class="icon-chip"><i data-lucide="check-square"></i></span>
        <span>Tasks</span>
      </button>
      <button class="pill-btn" data-filter="assignment">
        <span class="icon-chip"><i data-lucide="book-open"></i></span>
        <span>Study</span>
      </button>
      <button class="pill-btn" data-filter="goal">
        <span class="icon-chip"><i data-lucide="target"></i></span>
        <span>Goals</span>
      </button>
      <button class="pill-btn" data-filter="reminder">
        <span class="icon-chip"><i data-lucide="bell"></i></span>
        <span>Reminders</span>
      </button>
      <button class="pill-btn admin-pill" id="adminTabBtn" data-filter="admin" style="display:none;">
        <span class="icon-chip"><i data-lucide="bar-chart-2"></i></span>
        <span>Analytics</span>
      </button>
    </nav>

    <!-- Search Input -->
    <div class="search-wrapper">
      <i data-lucide="search" class="search-icon"></i>
      <input type="text" id="searchInput" class="search-field" placeholder="Search tasks, goals, or tags..." aria-label="Search">
    </div>

    <!-- Main View -->
    <main class="main-view">
      
      <!-- Tasks List -->
      <section id="tasksView" class="view-section active">
        <div class="items-list" id="taskList">
          <div class="skeleton-card" aria-busy="true"></div>
          <div class="skeleton-card" aria-busy="true"></div>
        </div>
      </section>

      <!-- Admin Analytics View (Dual Color Stat Row) -->
      <section id="adminView" class="view-section" style="display:none;">
        <div class="admin-panel" id="adminContent">
          <!-- Populated dynamically -->
        </div>
      </section>

    </main>

    <!-- Lavender Floating Action Button -->
    <button class="fab-btn" id="openAddModalBtn" aria-label="Add new item">
      <i data-lucide="plus" class="fab-icon"></i>
      <span>New Item</span>
    </button>

    <!-- Add Task Modal (Dual Color Clean Sheet) -->
    <div class="modal-backdrop" id="addModal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-sheet">
        <div class="modal-header">
          <div>
            <span class="eyebrow">QUICK ACTION</span>
            <h3 class="modal-title">Create New Item</h3>
          </div>
          <button class="close-btn" id="closeAddModalBtn" aria-label="Close">
            <i data-lucide="x"></i>
          </button>
        </div>

        <form id="addTaskForm" class="modal-form">
          <div class="form-group">
            <label class="form-label">CATEGORY</label>
            <div class="category-options">
              <label class="category-radio">
                <input type="radio" name="type" value="task" checked>
                <span class="radio-pill"><i data-lucide="check-square"></i> Task</span>
              </label>
              <label class="category-radio">
                <input type="radio" name="type" value="assignment">
                <span class="radio-pill"><i data-lucide="book-open"></i> Study</span>
              </label>
              <label class="category-radio">
                <input type="radio" name="type" value="goal">
                <span class="radio-pill"><i data-lucide="target"></i> Goal</span>
              </label>
              <label class="category-radio">
                <input type="radio" name="type" value="reminder">
                <span class="radio-pill"><i data-lucide="bell"></i> Reminder</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="taskContentInput" class="form-label">TITLE / DESCRIPTION</label>
            <input type="text" id="taskContentInput" class="form-input" placeholder="e.g. Complete DSA assignment by 8 PM" required>
          </div>

          <div class="form-row">
            <div class="form-group half">
              <label for="taskDateInput" class="form-label">DUE DATE</label>
              <input type="datetime-local" id="taskDateInput" class="form-input">
            </div>
            <div class="form-group half">
              <label for="taskPriorityInput" class="form-label">PRIORITY</label>
              <select id="taskPriorityInput" class="form-select">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="taskTagsInput" class="form-label">TAGS (COMMA SEPARATED)</label>
            <input type="text" id="taskTagsInput" class="form-input" placeholder="e.g. project, study, urgent">
          </div>

          <button type="submit" class="submit-pill-btn" id="submitTaskBtn">
            <span>Save to AtharvaOS</span>
            <i data-lucide="arrow-right"></i>
          </button>
        </form>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
