name: Deploy AtharvaOS Bot to AWS Lambda

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Package & Deploy to AWS Lambda
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MEME_API_URL: ${{ secrets.MEME_API_URL }}
          MEME_API_KEY: ${{ secrets.MEME_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          echo "Attaching Amazon Polly permissions to Lambda Execution Role..."
          ROLE_NAME=$(aws lambda get-function --function-name AtharvaOS-Bot --query 'Configuration.Role' --output text | awk -F'/' '{print $NF}')
          if [ -n "$ROLE_NAME" ]; then
            echo "Attaching AmazonPollyReadOnlyAccess to role: $ROLE_NAME"
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "arn:aws:iam::aws:policy/AmazonPollyReadOnlyAccess" || true
          fi

          echo "Packaging application..."
          zip -rq function.zip . -x ".git/*" ".github/*" ".env*" "README.md" "*.log"
          
          echo "Updating Lambda function code..."
          aws lambda update-function-code \
            --function-name AtharvaOS-Bot \
            --zip-file fileb://function.zip

          echo "Waiting for code update to complete..."
          aws lambda wait function-updated \
            --function-name AtharvaOS-Bot

          echo "Updating Lambda environment variables..."
          aws lambda update-function-configuration \
            --function-name AtharvaOS-Bot \
            --environment "Variables={BOT_TOKEN=\"$BOT_TOKEN\",CHAT_ID=\"$CHAT_ID\",MONGO_URI=\"$MONGO_URI\",GROQ_API_KEY=\"$GROQ_API_KEY\",MEME_API_URL=\"$MEME_API_URL\",MEME_API_KEY=\"$MEME_API_KEY\",ADMIN_SECRET=\"$ADMIN_SECRET\"}"

          echo "Waiting for configuration update to complete..."
          aws lambda wait function-updated \
            --function-name AtharvaOS-Bot

          echo "Linking Telegram Webhook for Bot Token..."
          node setWebhook.js https://ged2lb24hngndlzk5b73dmvdqy0ydsmo.lambda-url.ap-south-1.on.aws/

          echo "Setting up Amazon EventBridge 5-minute reminder cron..."
          aws events put-rule \
            --name "AtharvaOS-ReminderCron" \
            --schedule-expression "rate(5 minutes)" \
            --region ap-south-1

          aws lambda add-permission \
            --function-name AtharvaOS-Bot \
            --statement-id "EventBridgeReminderCron" \
            --action "lambda:InvokeFunction" \
            --principal "events.amazonaws.com" \
            --source-arn "arn:aws:events:ap-south-1:308369305204:rule/AtharvaOS-ReminderCron" \
            --region ap-south-1 || true

          aws events put-targets \
            --rule "AtharvaOS-ReminderCron" \
            --targets "Id=1,Arn=arn:aws:lambda:ap-south-1:308369305204:function:AtharvaOS-Bot,Input='{\"cron\":true}'" \
            --region ap-south-1
