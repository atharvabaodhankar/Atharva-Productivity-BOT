name: Deploy AtharvaOS Bot to AWS Lambda

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Package & Deploy to AWS Lambda
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Packaging application..."
          zip -rq function.zip . -x ".git/*" ".github/*" ".env*" "README.md" "*.log"
          
          echo "Updating Lambda function code..."
          aws lambda update-function-code \
            --function-name AtharvaOS-Bot \
            --zip-file fileb://function.zip

          echo "Waiting for code update to complete..."
          aws lambda wait function-updated \
            --function-name AtharvaOS-Bot

          echo "Updating Lambda environment variables..."
          aws lambda update-function-configuration \
            --function-name AtharvaOS-Bot \
            --environment "Variables={BOT_TOKEN=\"$BOT_TOKEN\",CHAT_ID=\"$CHAT_ID\",MONGO_URI=\"$MONGO_URI\",GROQ_API_KEY=\"$GROQ_API_KEY\"}"
